[package]
name = "avid-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
# Major-pinned to 2.x (CLI and core rev independently within v2; 2.6.x is
# current core). Lockfile records the exact resolved versions.
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avid-project = { path = "../../../crates/avid-project" }
avid-media = { path = "../../../crates/avid-media" }
avid-ai = { version = "0.0.0", path = "../../../crates/avid-ai" }
avid-timeline = { version = "0.0.0", path = "../../../crates/avid-timeline" }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tauri-plugin-opener = "2.5.5"
avid-render = { version = "0.0.0", path = "../../../crates/avid-render" }
uuid = { version = "1.26.1", features = ["v4"] }

[[bin]]
name = "avid-desktop"
path = "src/main.rs"
