[package]
name = "avid-ai"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
avid-core = { path = "../avid-core" }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq = { version = "3.4.2", features = ["json"] }
whisper-rs = "0.16.0"

[lib]
name = "avid_ai"
path = "src/lib.rs"
