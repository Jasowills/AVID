name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold:
    name: scaffold-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scaffold structure
        run: ./scripts/verify-scaffold.sh
      - name: Check no secrets committed
        run: |
          ! grep -rEi "sk-(live|ant|openai)|ghp_|gho_|xox[bpas]-|AKIA[0-9A-Z]{16}" \
            --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git --exclude-dir=dist . \
            || (echo "possible secret committed" && exit 1)

  node:
    name: node-typecheck-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck --workspace=@avid/desktop
      - run: npm test --workspace=@avid/desktop
      - run: npm run build --workspace=@avid/desktop

  rust:
    name: rust-fmt-clippy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
